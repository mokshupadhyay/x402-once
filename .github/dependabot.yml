version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # skip brand-new releases
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 has no compiler API, which the type-file bundler (tsup) needs. Revisit when tsup supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
