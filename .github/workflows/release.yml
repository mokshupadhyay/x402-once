name: release
# Stages a release when a version tag is pushed. Uses npm trusted publishing (OIDC): there is no npm token in this repository.
# Two human gates: (1) the `npm-release` environment needs a reviewer's approval before this job runs; (2) `npm stage publish`
# only uploads the package with its provenance, and a maintainer then approves it on npmjs.com with 2FA (or `npm stage approve <id>`).
# The trusted publisher on npmjs.com allows `npm stage publish` only, not a direct `npm publish`.
on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release # set a required reviewer on this environment in the repository settings
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.19.1 # `npm stage` and OIDC provenance need a recent npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm test && npm run build
      - run: node scripts/secret-scan.mjs
      - run: npm audit signatures || (sleep 15 && npm audit signatures)
      - run: npm stage publish --provenance --access public
