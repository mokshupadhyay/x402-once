name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Property tests at high volume
        if: matrix.node == 24
        run: RUNS=30000 npx vitest --run tests/properties.test.ts --testTimeout=600000
      - name: Install the packed tarball in a clean project (ESM and CJS)
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm i "$RUNNER_TEMP"/x402-once-*.tgz @x402/core@2.32.0
          node --input-type=module -e "import('x402-once').then(m => { if (typeof m.createPaidFetch !== 'function') process.exit(1) })"
          node -e "const m = require('x402-once'); if (typeof m.createPaidFetch !== 'function') process.exit(1)"
          node --input-type=module -e "import('x402-once/node').then(m => { if (typeof m.FilePaymentStore !== 'function') process.exit(1) })"
      - run: npm audit --omit=dev --audit-level=high

  core-compat:
    # The peer range is >=2.32.0 <3. Check the newest @x402 packages still typecheck and pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save @x402/core@^2 @x402/evm@^2 @x402/fetch@^2
      - run: npm run typecheck
      - run: npm test
